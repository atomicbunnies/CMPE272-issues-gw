name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run lint
      run: |
        python -m ruff check . --select E4,E7,E9,F
    - name: Run Pytest
      env:
        GITHUB_TOKEN: "dummy_ci_token"
        GITHUB_OWNER: "atomicbunnies"
        GITHUB_REPO: "CMPE272-issues-gw"
        WEBHOOK_SECRET: "mysecretkey123"
        PORT: "8000"
      run: |
        python -m pytest --cov=main --cov-report=term-missing
    - name: Build Docker image
      run: docker build -t github-issues-gateway .
